plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kashmirtravelify.crm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kashmirtravelify.crm'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '1.0.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
